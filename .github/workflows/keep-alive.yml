name: Keep backend awake

on:
  schedule:
    # Render 무료 플랜은 15분간 요청이 없으면 잠드므로, 그보다 짧은 주기로 깨워둔다.
    # GitHub 공식 권장사항: 정각(0,10,20...)처럼 딱 떨어지는 시각은 전체 이용자가 몰려서
    # 스케줄이 누락/지연되기 쉬우므로, 애매한 시각(3,13,23...)으로 어긋나게 둔다.
    - cron: "3,13,23,33,43,53 * * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health endpoint
        run: curl -sf https://redmine-ai-1.onrender.com/health
