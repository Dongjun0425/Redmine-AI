<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Redmine AI 검색</title>
<style>
  :root {
    --bg: #faf9f6;
    --surface: #ffffff;
    --surface-2: #f2efe9;
    --border: #e7e2d8;
    --text: #2b2822;
    --text-muted: #8b8578;
    --accent: #da7756;
    --accent-dark: #c1633f;
    --accent-soft: #fbe9e1;
    --danger: #c0392b;
    --shadow: 0 1px 2px rgba(30, 25, 15, 0.04), 0 6px 20px rgba(30, 25, 15, 0.05);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1e1c19;
      --surface: #29271f;
      --surface-2: #23211b;
      --border: #3d392f;
      --text: #ede9df;
      --text-muted: #9b9587;
      --accent: #e2896a;
      --accent-dark: #eda385;
      --accent-soft: #3a291f;
      --danger: #e07a68;
      --shadow: 0 1px 2px rgba(0, 0, 0, 0.2), 0 8px 24px rgba(0, 0, 0, 0.28);
    }
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    font-family: -apple-system, "Pretendard", "맑은 고딕", "Segoe UI", sans-serif;
    background: var(--bg);
    color: var(--text);
    transition: background 0.2s ease, color 0.2s ease;
  }
  [hidden] { display: none !important; }
  a { color: inherit; }

  /* ---------- 로그인 화면 ---------- */
  #loginScreen {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .login-card {
    width: 100%;
    max-width: 360px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 32px 28px;
    box-shadow: var(--shadow);
  }
  .login-card .mark {
    width: 44px;
    height: 44px;
    border-radius: 13px;
    background: var(--accent);
    color: white;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
    margin: 0 auto 16px;
  }
  .login-card h2 {
    font-size: 17px;
    margin: 0 0 4px;
    text-align: center;
    font-weight: 600;
  }
  .login-card .hint {
    color: var(--text-muted);
    font-size: 13px;
    text-align: center;
    margin: 0 0 22px;
  }
  .field { margin-bottom: 12px; }
  .field label {
    display: block;
    font-size: 12px;
    color: var(--text-muted);
    margin-bottom: 5px;
  }
  .field input {
    width: 100%;
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 11px 13px;
    font-size: 14px;
    font-family: inherit;
    outline: none;
    background: var(--surface-2);
    color: var(--text);
    transition: border-color 0.15s ease;
  }
  .field input:focus { border-color: var(--accent); }
  button.primary {
    width: 100%;
    background: var(--accent);
    color: white;
    border: none;
    border-radius: 12px;
    padding: 12px 18px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    margin-top: 8px;
    transition: background 0.15s ease;
  }
  button.primary:hover { background: var(--accent-dark); }
  button.primary:disabled { opacity: 0.55; cursor: default; }
  .login-error {
    color: var(--danger);
    font-size: 13px;
    margin-top: 10px;
    text-align: center;
    min-height: 18px;
  }

  /* ---------- 검색 화면 ---------- */
  #appScreen {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 20px 16px 100px;
    transition: padding-top 0.35s ease;
  }
  #appScreen.centered {
    justify-content: center;
    padding-top: 20px;
    padding-bottom: 20vh;
  }

  .page {
    width: 100%;
    max-width: 700px;
  }

  .user-bar {
    display: flex;
    justify-content: flex-end;
    align-items: center;
    gap: 10px;
    margin-bottom: 18px;
    font-size: 12px;
    color: var(--text-muted);
  }
  .user-bar button {
    background: none;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 4px 10px;
    font-size: 12px;
    color: var(--text-muted);
    cursor: pointer;
    font-family: inherit;
  }
  .user-bar button:hover { border-color: var(--accent); color: var(--accent); }

  .brand {
    text-align: center;
    margin-bottom: 22px;
    transition: opacity 0.25s ease, margin 0.25s ease;
  }
  .brand .mark {
    width: 40px;
    height: 40px;
    border-radius: 12px;
    background: var(--accent);
    color: white;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-size: 19px;
    margin-bottom: 10px;
  }
  .brand h1 {
    font-size: 21px;
    margin: 0 0 6px;
    font-weight: 600;
  }
  .brand .tagline {
    color: var(--text-muted);
    font-size: 13.5px;
    margin: 0;
  }
  #appScreen:not(.centered) .brand { display: none; }

  .composer {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 22px;
    padding: 14px 14px 10px;
    box-shadow: var(--shadow);
  }
  .composer textarea {
    width: 100%;
    border: none;
    resize: none;
    font-size: 15.5px;
    font-family: inherit;
    outline: none;
    min-height: 48px;
    max-height: 200px;
    background: transparent;
    color: var(--text);
    line-height: 1.5;
  }
  .composer textarea::placeholder { color: var(--text-muted); }
  .composer-toolbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-top: 6px;
    gap: 8px;
  }
  select#projectSelect {
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 6px 12px;
    font-size: 12.5px;
    background: var(--surface-2);
    color: var(--text);
    font-family: inherit;
    cursor: pointer;
    max-width: 55%;
  }
  #sendBtn {
    width: 34px;
    height: 34px;
    border-radius: 50%;
    background: var(--accent);
    color: white;
    border: none;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    flex-shrink: 0;
    transition: background 0.15s ease, opacity 0.15s ease;
  }
  #sendBtn:hover { background: var(--accent-dark); }
  #sendBtn:disabled { opacity: 0.4; cursor: default; }
  #sendBtn svg { width: 16px; height: 16px; }

  .status-line {
    margin: 18px 6px 10px;
    color: var(--text-muted);
    font-size: 13px;
    display: flex;
    align-items: center;
    gap: 8px;
    min-height: 18px;
  }
  .thinking-dots {
    display: inline-flex;
    gap: 3px;
  }
  .thinking-dots span {
    width: 5px;
    height: 5px;
    border-radius: 50%;
    background: var(--text-muted);
    animation: bounce 1.1s infinite ease-in-out;
  }
  .thinking-dots span:nth-child(2) { animation-delay: 0.15s; }
  .thinking-dots span:nth-child(3) { animation-delay: 0.3s; }
  @keyframes bounce {
    0%, 80%, 100% { transform: translateY(0); opacity: 0.5; }
    40% { transform: translateY(-3px); opacity: 1; }
  }

  .results {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .card {
    display: block;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 14px 17px;
    text-decoration: none;
    color: inherit;
    transition: border-color 0.15s ease, transform 0.15s ease;
  }
  .card:hover { border-color: var(--accent); transform: translateY(-1px); }
  .card .top {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 8px;
    margin-bottom: 5px;
  }
  .card .project {
    font-size: 11px;
    color: var(--accent-dark);
    background: var(--accent-soft);
    border-radius: 6px;
    padding: 2px 8px;
    white-space: nowrap;
    font-weight: 600;
  }
  .card .issue-id {
    font-size: 11.5px;
    color: var(--text-muted);
    white-space: nowrap;
  }
  .card .subject {
    font-size: 15px;
    font-weight: 600;
    margin: 0 0 4px;
  }
  .card .snippet {
    font-size: 13px;
    color: var(--text-muted);
    line-height: 1.5;
    margin: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
  }
</style>
</head>
<body>

<!-- 로그인 화면 -->
<div id="loginScreen">
  <div class="login-card">
    <div class="mark">✦</div>
    <h2>Redmine 로그인</h2>
    <p class="hint">본인의 Redmine 아이디/비밀번호로 로그인하세요.</p>
    <form id="loginForm">
      <div class="field">
        <label for="loginUsername">아이디</label>
        <input id="loginUsername" type="text" autocomplete="username" required>
      </div>
      <div class="field">
        <label for="loginPassword">비밀번호</label>
        <input id="loginPassword" type="password" autocomplete="current-password" required>
      </div>
      <button type="submit" class="primary" id="loginBtn">로그인</button>
      <div id="loginError" class="login-error"></div>
    </form>
  </div>
</div>

<!-- 검색 화면 -->
<div id="appScreen" class="centered" hidden>
  <div class="page">
    <div class="user-bar">
      <span id="userLabel"></span>
      <button id="logoutBtn">로그아웃</button>
    </div>

    <div class="brand">
      <div class="mark">✦</div>
      <h1>무엇을 찾고 계세요?</h1>
      <p class="tagline">단어든 문장이든 편하게 입력하세요. 의미가 비슷한 게시물까지 찾아드려요.</p>
    </div>

    <div class="composer">
      <textarea id="queryInput" placeholder="예) 나 지금 프린터 관련 내역 처리중인데 관련 게시물 보여줘" rows="1"></textarea>
      <div class="composer-toolbar">
        <select id="projectSelect">
          <option value="">전체 프로젝트</option>
        </select>
        <button id="sendBtn" aria-label="검색">
          <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M12 19V5M12 5L5 12M12 5l7 7" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
      </div>
    </div>

    <div id="status" class="status-line"></div>
    <div id="results" class="results"></div>
  </div>
</div>

<script>
  const API_BASE = "https://redmine-ai-1.onrender.com";
  const TOKEN_KEY = "redmine_ai_search_session";

  const loginScreen = document.getElementById("loginScreen");
  const appScreen = document.getElementById("appScreen");
  const loginForm = document.getElementById("loginForm");
  const loginUsername = document.getElementById("loginUsername");
  const loginPassword = document.getElementById("loginPassword");
  const loginBtn = document.getElementById("loginBtn");
  const loginError = document.getElementById("loginError");
  const userLabel = document.getElementById("userLabel");
  const logoutBtn = document.getElementById("logoutBtn");

  const queryInput = document.getElementById("queryInput");
  const projectSelect = document.getElementById("projectSelect");
  const sendBtn = document.getElementById("sendBtn");
  const statusEl = document.getElementById("status");
  const resultsEl = document.getElementById("results");

  function getSession() {
    try {
      return JSON.parse(localStorage.getItem(TOKEN_KEY) || "null");
    } catch (e) {
      return null;
    }
  }

  function setSession(session) {
    if (session) localStorage.setItem(TOKEN_KEY, JSON.stringify(session));
    else localStorage.removeItem(TOKEN_KEY);
  }

  function showLogin(message) {
    setSession(null);
    appScreen.hidden = true;
    loginScreen.hidden = false;
    loginError.textContent = message || "";
  }

  function showApp(session) {
    loginScreen.hidden = true;
    appScreen.hidden = false;
    userLabel.textContent = (session.name || session.login) + "님";
  }

  async function apiGet(path, params) {
    const session = getSession();
    const url = new URL(API_BASE + path);
    Object.entries(params || {}).forEach(([k, v]) => {
      if (v !== null && v !== undefined && v !== "") url.searchParams.set(k, v);
    });
    const res = await fetch(url, {
      headers: { "Authorization": "Bearer " + (session ? session.token : "") },
    });
    if (res.status === 401) {
      showLogin("세션이 만료되었어요. 다시 로그인해주세요.");
      throw new Error("세션 만료");
    }
    if (!res.ok) throw new Error("서버 오류 (" + res.status + ")");
    return res.json();
  }

  async function loadProjects() {
    projectSelect.innerHTML = '<option value="">전체 프로젝트</option>';
    try {
      const projects = await apiGet("/projects");
      for (const p of projects) {
        const opt = document.createElement("option");
        opt.value = p.project_id;
        opt.textContent = p.project_name;
        projectSelect.appendChild(opt);
      }
    } catch (e) {
      console.error("프로젝트 목록을 불러오지 못했습니다", e);
    }
  }

  function setThinking(on) {
    if (on) {
      statusEl.innerHTML = "";
      const label = document.createElement("span");
      label.textContent = "찾는 중";
      const dots = document.createElement("span");
      dots.className = "thinking-dots";
      dots.innerHTML = "<span></span><span></span><span></span>";
      statusEl.appendChild(label);
      statusEl.appendChild(dots);
    } else {
      statusEl.textContent = "";
    }
  }

  function renderResults(items) {
    resultsEl.innerHTML = "";
    if (!items.length) {
      statusEl.textContent = "관련된 게시물을 찾지 못했어요.";
      return;
    }
    statusEl.textContent = `${items.length}건 찾았어요.`;
    for (const item of items) {
      // 게시물 내용에 <img> 등 HTML 태그가 섞여 있을 수 있어서, innerHTML이 아니라
      // textContent로만 넣어 실제 태그가 절대 렌더링(및 깨진 이미지로 표시)되지 않게 한다.
      const a = document.createElement("a");
      a.className = "card";
      a.href = item.url;
      a.target = "_blank";
      a.rel = "noopener";

      const top = document.createElement("div");
      top.className = "top";
      const projectSpan = document.createElement("span");
      projectSpan.className = "project";
      projectSpan.textContent = item.project_name;
      const idSpan = document.createElement("span");
      idSpan.className = "issue-id";
      idSpan.textContent = "#" + item.id;
      top.appendChild(projectSpan);
      top.appendChild(idSpan);

      const subjectP = document.createElement("p");
      subjectP.className = "subject";
      subjectP.textContent = item.subject;

      const snippetP = document.createElement("p");
      snippetP.className = "snippet";
      snippetP.textContent = item.snippet;

      a.appendChild(top);
      a.appendChild(subjectP);
      a.appendChild(snippetP);
      resultsEl.appendChild(a);
    }
  }

  async function runSearch() {
    const q = queryInput.value.trim();
    if (!q) return;

    appScreen.classList.remove("centered");
    sendBtn.disabled = true;
    setThinking(true);
    resultsEl.innerHTML = "";

    try {
      const items = await apiGet("/search", {
        q,
        project_id: projectSelect.value || null,
        limit: 30,
      });
      renderResults(items);
    } catch (e) {
      if (e.message !== "세션 만료") statusEl.textContent = "검색에 실패했어요: " + e.message;
    } finally {
      sendBtn.disabled = false;
    }
  }

  async function handleLogin(e) {
    e.preventDefault();
    loginError.textContent = "";
    loginBtn.disabled = true;
    loginBtn.textContent = "로그인 중...";
    try {
      const res = await fetch(API_BASE + "/login", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          username: loginUsername.value.trim(),
          password: loginPassword.value,
        }),
      });
      if (!res.ok) {
        const data = await res.json().catch(() => ({}));
        throw new Error(data.detail || "로그인에 실패했어요.");
      }
      const session = await res.json();
      setSession(session);
      loginPassword.value = "";
      showApp(session);
      loadProjects();
    } catch (e) {
      loginError.textContent = e.message;
    } finally {
      loginBtn.disabled = false;
      loginBtn.textContent = "로그인";
    }
  }

  function handleLogout() {
    showLogin();
    loginUsername.value = "";
    loginPassword.value = "";
  }

  // textarea 높이를 입력 내용에 맞게 자동으로 늘린다 (채팅 입력창 느낌).
  function autoGrow() {
    queryInput.style.height = "auto";
    queryInput.style.height = Math.min(queryInput.scrollHeight, 200) + "px";
  }

  loginForm.addEventListener("submit", handleLogin);
  logoutBtn.addEventListener("click", handleLogout);
  sendBtn.addEventListener("click", runSearch);
  queryInput.addEventListener("input", autoGrow);
  queryInput.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey) {
      e.preventDefault();
      runSearch();
    }
  });

  // 시작 시: 저장된 세션이 있으면 바로 검색 화면으로, 없으면 로그인 화면
  const existing = getSession();
  if (existing) {
    showApp(existing);
    loadProjects();
  } else {
    showLogin();
  }
</script>
</body>
</html>
